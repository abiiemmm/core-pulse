name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    name: Sole-maintainer ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Audit published commits, not GitHub's temporary PR merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check authors, co-author trailers and code owners
        run: |
          python scripts/check-repository.py
          python -m unittest discover -s tests -p test_repository.py

  windows:
    name: Windows checks and installer
    needs: ownership
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Cache dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/nuget
            sidecar/third-party/source
          key: dependencies-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'sidecar/packages.lock.json', 'sidecar/source-manifest.json', 'global.json') }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare sensor resources and run host self-test
        run: npm run sensors:build
      # Keep the default PR merge checkout here to test integration with main.
      - name: Check contracts, analytics, translations, SQLite and Rust
        run: npm run check:app
      - name: Build unsigned internal installer
        run: npm run tauri:build
      - name: Write installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No installer produced.' }
          $lines = @($installers | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name })
          $lines | Set-Content -LiteralPath src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload unsigned installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-pulse-internal-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
