[package]
name = "core-pulse"
version = "0.1.0"
description = "Local Windows performance monitor and safe tuner"
authors = ["abiiemmm"]
edition = "2021"

[lib]
name = "core_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.39.6"
regex = "1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
tauri-plugin-single-instance = "=2.4.0"
